name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Install isolation tooling
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3
      - name: Network-disabled isolated release checks
        run: make check-isolated
